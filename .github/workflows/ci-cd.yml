name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code download
        uses: actions/checkout@v4

      - name: Frontend image build
        run: docker build -t todo-frontend ./frontend

      - name: Backend image build
        run: docker build -t todo-backend ./backend

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Code download
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend packages install
        working-directory: ./backend
        run: npm install

      - name: Backend code check
        working-directory: ./backend
        run: node --check server.js

  push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Code download
        uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Frontend image push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.run_number }}

      - name: Backend image push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.run_number }}
